<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#222222">

    <title>My Cloud Files</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f4f6;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
        }

        main {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        h2 {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #1769e0;
            color: white;
            font-size: 17px;
        }

        button:active {
            opacity: 0.7;
        }

        .status {
            background: #eef1f5;
            padding: 14px;
            border-radius: 10px;
            line-height: 1.6;
            word-break: break-word;
        }

        .file-info {
            margin-top: 15px;
            padding: 15px;
            background: #f7f7f7;
            border-radius: 10px;
            display: none;
        }

        .success {
            color: #137333;
            font-weight: bold;
        }

    </style>

</head>

<body>

<header>
    My Cloud Files
</header>


<main>


    <!-- iCloud -->

    <div class="card">

        <h2> iCloud Drive</h2>

        <p>
            Open your existing iCloud files using Apple's
            web interface.
        </p>

        <button onclick="openICloud()">
            Open iCloud Drive
        </button>

    </div>


    <!-- Local File -->

    <div class="card">

        <h2>📂 Fire Storage</h2>

        <p>
            Select a file that has already been downloaded
            to the Fire HD 8.
        </p>

        <button onclick="selectFile()">
            Select a File
        </button>

        <div id="fileInfo" class="file-info">

            <div id="fileName"></div>

            <div id="fileSize"></div>

            <div id="fileType"></div>

        </div>

    </div>


    <!-- Status -->

    <div class="card">

        <h2>Status</h2>

        <div id="status" class="status">
            Ready.
        </div>

    </div>


</main>


<script>


/*
    Open Apple's iCloud Drive web interface
*/

function openICloud() {

    setStatus(
        "Opening iCloud Drive..."
    );

    window.open(
        "https://www.icloud.com/iclouddrive/",
        "_blank"
    );
}



/*
    Ask Silk to let the user choose a local file.
*/

function selectFile() {

    setStatus(
        "Opening the Fire file picker..."
    );

    const input =
        document.createElement("input");

    input.type = "file";

    /*
        We don't restrict the file type.
        The user can select PDF, TXT, JPG, etc.
    */

    input.accept = "*/*";


    input.onchange = function(event) {

        const files = event.target.files;

        if (!files || files.length === 0) {

            setStatus(
                "No file was selected."
            );

            return;
        }


        const file = files[0];


        /*
            Display information about the
            selected file.
        */

        document.getElementById(
            "fileName"
        ).innerHTML =
            "<b>Name:</b> " +
            escapeHtml(file.name);


        document.getElementById(
            "fileSize"
        ).innerHTML =
            "<b>Size:</b> " +
            formatBytes(file.size);


        document.getElementById(
            "fileType"
        ).innerHTML =
            "<b>Type:</b> " +
            (file.type || "Unknown");


        document.getElementById(
            "fileInfo"
        ).style.display = "block";


        setStatus(
            '<span class="success">' +
            "File successfully received by JavaScript." +
            "</span>"
        );

    };


    /*
        Trigger the Fire/Silk file picker.
    */

    input.click();

}



/*
    Convert bytes into a readable size.
*/

function formatBytes(bytes) {

    if (bytes === 0) {
        return "0 Bytes";
    }

    const units = [
        "Bytes",
        "KB",
        "MB",
        "GB"
    ];

    const index =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );

    return (
        parseFloat(
            (
                bytes /
                Math.pow(1024, index)
            ).toFixed(2)
        )
        + " "
        + units[index]
    );

}



/*
    Prevent accidental HTML injection
    when displaying the filename.
*/

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}



/*
    Update status display.
*/

function setStatus(message) {

    document.getElementById(
        "status"
    ).innerHTML = message;

}


</script>

</body>

</html>
